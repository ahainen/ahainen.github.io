<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <style>
      @font-face {
        font-family: "AngerFoot";
        src: url("Anger-Foot.woff") format("woff");
        font-weight: normal;
        font-style: normal;
      }

      img {
        position: absolute;
      }

      * {
        font-family: "AngerFoot", sans-serif;
        color: #f11672;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      #sep {
        margin: -5px;
      }

      #clock {
        font-size: 72px;
        letter-spacing: -12px;
        left: 210px;
        top: 100px;
        position: absolute;
        text-shadow: -6px 6px 0px black;
        z-index: 2;
      }

      /* ---------- BULLETS (slinky bob) ---------- */
      .bullet {
        width: 60px;
        align-self: center;
        position: relative; /* relative so translateY doesn't affect other layout weirdness */
        z-index: 10;

        /* tweakables */
        --amp: 10px;     /* how far up/down */
        --dur: 5.5s;     /* speed */
        --delay: 0s;     /* phase offset per bullet */

        animation: bob var(--dur) ease-in-out infinite;
        animation-delay: var(--delay);

        will-change: transform;
        transform: translateZ(0);
      }

      /* smoother-than-triangle “sine-ish” bob */
      @keyframes bob {
        0%   { transform: translateY(0); }
        12.5%{ transform: translateY(calc(var(--amp) * -0.7)); }
        25%  { transform: translateY(calc(var(--amp) * -1)); }
        37.5%{ transform: translateY(calc(var(--amp) * -0.7)); }
        50%  { transform: translateY(0); }
        62.5%{ transform: translateY(calc(var(--amp) * 0.7)); }
        75%  { transform: translateY(var(--amp)); }
        87.5%{ transform: translateY(calc(var(--amp) * 0.7)); }
        100% { transform: translateY(0); }
      }

      /* phase offsets (negative so it starts moving immediately in OBS) */
      .bullet:nth-child(1) { --delay: -0.00s; }
      .bullet:nth-child(2) { --delay: -0.25s; }
      .bullet:nth-child(3) { --delay: -0.50s; }
      .bullet:nth-child(4) { --delay: -0.75s; }
      .bullet:nth-child(5) { --delay: -1.00s; }
      .bullet:nth-child(6) { --delay: -1.25s; }
      /* ------------------------------------------ */

      #kickAnimWrap {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #kickAnimWrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>

  <body>
    <div id="clock">
      <span id="hh">12</span><span id="sep">!</span><span id="mm">00</span>
    </div>

    <div
      style="
        display: flex;
        flex-direction: row;
        position: absolute;
        bottom: 64px;
        left: 80px;
        gap: 24px;
      "
    >
      <img src="bullet.svg" class="bullet" />
      <img src="bullet.svg" class="bullet" />
      <img src="bullet.svg" class="bullet" />
      <img src="bullet.svg" class="bullet" />
      <img src="bullet.svg" class="bullet" />
      <img src="bullet.svg" class="bullet" />
    </div>

    <img src="time.svg" style="width: 400px; top: 76px; left: 80px" />
    <img
      src="kickqr.svg"
      style="width: 640px; bottom: 72px; left: 50%; transform: translateX(-50%); z-index:10;"
    />

    <div id="kickAnimWrap">
      <img id="kickAnim" alt="kick" />
    </div>

    <script>
      // --- clock ---
      const hhEl = document.getElementById("hh");
      const mmEl = document.getElementById("mm");
      const sepEl = document.getElementById("sep");

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function updateClock() {
        const now = new Date();
        let h = now.getHours();
        const m = now.getMinutes();
        h = h % 12;
        if (h === 0) h = 12;
        hhEl.textContent = String(h);
        mmEl.textContent = pad2(m);
      }
      sepEl.style.visibility = "visible";
      updateClock();
      setInterval(updateClock, 2000);

      // --- kick animation preload + replay ---
      let kickImg = document.getElementById("kickAnim");
      let kickBlobUrl = null;

      const BLANK =
        "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";

      kickImg.src = BLANK; // <- important: do NOT show the animated webp on load

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) kickImg.src = BLANK;
      });

      window.addEventListener("focus", () => {
        kickImg.src = BLANK;
      });

      const COOLDOWN_MS = 200;
      let lastKickAt = 0;

      (async function preloadKick() {
        try {
          console.log("[overlay] preloading kick-once.webp...");
          const res = await fetch("kick-once.webp", { cache: "force-cache" });
          console.log("[overlay] kick-once.webp status:", res.status);

          const blob = await res.blob();
          kickBlobUrl = URL.createObjectURL(blob);

          // Preload/prime decode WITHOUT assigning to the visible <img>
          const pre = new Image();
          pre.decoding = "async";
          pre.src = kickBlobUrl;

          console.log("[overlay] kick-once.webp preloaded OK");
        } catch (e) {
          console.error("[overlay] preload failed:", e);
        }
      })();

      function playKickOnce() {
        const now = Date.now();
        if (now - lastKickAt < COOLDOWN_MS) return;
        lastKickAt = now;

        if (!kickBlobUrl) return;

        kickImg.src = BLANK;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            kickImg.src = kickBlobUrl;
          });
        });
      }

      window.addEventListener("beforeunload", () => {
        if (kickBlobUrl) URL.revokeObjectURL(kickBlobUrl);
      });

      // --- realtime: Supabase Broadcast ---
      const SUPABASE_URL = "https://rcwvicblzidaukglxquu.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_7to8QZuk22ORD8SnfiSRjg_U7f7EeQ0";

      const CHANNEL = "angerfoot-kick";
      const EVENT = "kick";

      (async () => {
        try {
          console.log("[overlay] realtime init...");

          const { createClient } =
            await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");

          const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            realtime: { params: { eventsPerSecond: 20 } },
          });

          const channel = supabase.channel(CHANNEL);

          channel.on("broadcast", { event: EVENT }, (payload) => {
            console.log("[overlay] GOT KICK:", payload);
            playKickOnce();
          });

          channel.subscribe((status) => {
            console.log("[overlay] realtime status:", status);
          });
        } catch (e) {
          console.error("[overlay] realtime setup failed:", e);
        }
      })();
    </script>
  </body>
</html>
