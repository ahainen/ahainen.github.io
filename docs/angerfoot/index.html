<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kick</title>

    <style>
      img {
        position: relative;
      }

      .hint {
        display: none;
        position: fixed;
        bottom: 16px;
        opacity: 0.7;
        color: white;
      }
    </style>
  </head>

  <body>
    <button
      id="kickBtn"
      style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center;
        background: none;
        border: none;
        cursor: pointer;

        /* smooth but snappy */
        transition: transform 90ms cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: transform;
      "
    >
      <img src="kick.svg" style="width: 300px" />
    </button>

    <div class="hint" id="status">Connecting…</div>

    <script type="module">
      // -------------------------
      // Supabase setup
      // -------------------------
      const SUPABASE_URL = "https://rcwvicblzidaukglxquu.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_7to8QZuk22ORD8SnfiSRjg_U7f7EeQ0";

      const CHANNEL = "angerfoot-kick";
      const EVENT = "kick";

      const statusEl = document.getElementById("status");
      const btn = document.getElementById("kickBtn");

      const { createClient } =
        await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const channel = supabase.channel(CHANNEL);

      btn.disabled = true;

      const { error } = await channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          statusEl.textContent = "Connected";
          btn.disabled = false;
        } else if (status === "TIMED_OUT") {
          statusEl.textContent = "Timed out… retrying";
        } else if (status === "CHANNEL_ERROR") {
          statusEl.textContent = "Channel error";
        } else if (status === "CLOSED") {
          statusEl.textContent = "Disconnected";
          btn.disabled = true;
        }
      });

      if (error) {
        console.error(error);
        statusEl.textContent = "Failed to connect";
      }

      // -------------------------
      // SFX (overlapping / random)
      // -------------------------
      const SFX_COUNT = 15;
      const SFX_PATHS = Array.from(
        { length: SFX_COUNT },
        (_, i) => `sfx/sfx${i + 1}.mp3`
      );

      const SFX_VOLUME = 0.9;
      const MAX_VOICES = 10;

      let audioCtx = null;
      let sfxBuffers = null;
      let activeVoices = 0;

      function ensureAudioCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      async function preloadSfx() {
        const ctx = ensureAudioCtx();

        const buffers = await Promise.all(
          SFX_PATHS.map(async (url) => {
            const res = await fetch(url, { cache: "force-cache" });
            if (!res.ok) throw new Error(`SFX fetch failed: ${url}`);
            const arr = await res.arrayBuffer();
            return await ctx.decodeAudioData(arr);
          })
        );

        sfxBuffers = buffers;
        console.log("[sfx] preloaded", sfxBuffers.length);
      }

      function pickRandom(arr) {
        return arr[(Math.random() * arr.length) | 0];
      }

      async function playRandomSfx() {
        const ctx = ensureAudioCtx();
        if (ctx.state !== "running") await ctx.resume();
        if (!sfxBuffers) return;
        if (activeVoices >= MAX_VOICES) return;

        const source = ctx.createBufferSource();
        source.buffer = pickRandom(sfxBuffers);

        const gain = ctx.createGain();
        gain.gain.value = SFX_VOLUME;

        source.connect(gain);
        gain.connect(ctx.destination);

        activeVoices++;
        source.onended = () => {
          activeVoices = Math.max(0, activeVoices - 1);
          source.disconnect();
          gain.disconnect();
        };

        source.start(0);
      }

      preloadSfx().catch((e) =>
        console.warn("[sfx] preload failed:", e)
      );

      // -------------------------
      // Button broadcast + sound
      // -------------------------
      const LOCAL_COOLDOWN_MS = 250;
      let lastSent = 0;

      btn.addEventListener("click", async () => {
        // play sound instantly (can overlap)
        playRandomSfx();

        const now = Date.now();
        if (now - lastSent < LOCAL_COOLDOWN_MS) return;
        lastSent = now;

        const { error: sendErr } = await channel.send({
          type: "broadcast",
          event: EVENT,
          payload: { at: now },
        });

        if (sendErr) console.error("Send error:", sendErr);
      });

      // -------------------------
      // Button scale animation
      // -------------------------
      (function () {
        const BASE = "translate(-50%, -50%)";
        const SCALE = {
          up: 1.0,
          hover: 1.01,
          down: 0.97,
        };

        let hovered = false;
        let down = false;

        function apply() {
          const s = down ? SCALE.down : hovered ? SCALE.hover : SCALE.up;
          btn.style.transform = `${BASE} scale(${s})`;
        }

        btn.addEventListener("mouseenter", () => {
          hovered = true;
          apply();
        });

        btn.addEventListener("mouseleave", () => {
          hovered = false;
          down = false;
          apply();
        });

        btn.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          down = true;
          apply();

          const onUp = () => {
            down = false;
            apply();
            cleanup();
          };

          const onBlur = () => {
            down = false;
            apply();
            cleanup();
          };

          function cleanup() {
            window.removeEventListener("mouseup", onUp, true);
            window.removeEventListener("blur", onBlur, true);
          }

          window.addEventListener("mouseup", onUp, true);
          window.addEventListener("blur", onBlur, true);
        });

        btn.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse") return;
          down = true;
          apply();
          btn.setPointerCapture?.(e.pointerId);
        });

        btn.addEventListener("pointerup", (e) => {
          if (e.pointerType === "mouse") return;
          down = false;
          apply();
          btn.releasePointerCapture?.(e.pointerId);
        });

        btn.addEventListener("pointercancel", () => {
          down = false;
          apply();
        });

        btn.addEventListener("keydown", (e) => {
          if (e.repeat) return;
          if (e.key === " " || e.key === "Enter") {
            down = true;
            apply();
          }
        });

        btn.addEventListener("keyup", (e) => {
          if (e.key === " " || e.key === "Enter") {
            down = false;
            apply();
          }
        });

        apply();
      })();
    </script>
  </body>
</html>
